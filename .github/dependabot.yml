version: 2
updates:
  # A root NuGet scan discovers all six nested project files. Keep the two
  # Terminal.Gui packages together while reviewing their API changes manually.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    allow:
      - dependency-type: all
    assignees: [harder]
    open-pull-requests-limit: 10
    # Keep the .NET 10 servicing family together; major migrations are deliberate.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">=11.0.0"]
      - dependency-name: "Microsoft.Bcl.AsyncInterfaces"
        versions: [">=11.0.0"]
      # MTP 2.x requires the three-argument TrackEvent API removed in 3.x.
      - dependency-name: "Microsoft.ApplicationInsights"
        versions: [">=3.0.0"]
    groups:
      terminal-gui:
        patterns: ["Terminal.Gui", "Terminal.Gui.Editor"]
      test-platform:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.Testing.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Chicago
    assignees: [harder]
    open-pull-requests-limit: 10
    groups:
      github-maintained:
        patterns: ["actions/*", "github/*"]

  # global.json is a dependency too; keep SDK roll-forwards reviewable.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    assignees: [harder]
    open-pull-requests-limit: 5
