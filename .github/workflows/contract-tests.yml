name: contract-tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      gh_version:
        description: 'Override the latest lane only (e.g., 2.102.0); the minimum lane always runs'
        required: false

permissions:
  contents: read

jobs:
  contract:
    name: gh ${{ matrix.gh-version }} contract tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gh-version: '2.97.0'
          - gh-version: 'latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install gh ${{ matrix.gh-version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_VERSION_OVERRIDE: ${{ inputs.gh_version }}
        run: |
          VERSION="${{ matrix.gh-version }}"
          if [ "$VERSION" = latest ] && [ -n "$GH_VERSION_OVERRIDE" ]; then
            VERSION="$GH_VERSION_OVERRIDE"
          fi
          if [ "$VERSION" != latest ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid gh version: $VERSION" >&2
            exit 1
          fi
          if [ "$VERSION" = "latest" ]; then
            # Install latest from GitHub's own apt repo
            (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
              && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y
          else
            # Install pinned version from GitHub release tarball
            ARCH="$(dpkg --print-architecture)"
            URL="https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_${ARCH}.tar.gz"
            curl -fsSL "$URL" -o /tmp/gh.tar.gz
            tar -xzf /tmp/gh.tar.gz -C /tmp
            sudo cp "/tmp/gh_${VERSION}_linux_${ARCH}/bin/gh" /usr/local/bin/gh
            sudo chmod +x /usr/local/bin/gh
          fi
          gh --version

      - name: Verify gh auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run contract tests
        env:
          SKILLVIEW_CONTRACT_TESTS: 'true'
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet test --project tests/SkillView.Tests/SkillView.Tests.csproj \
            --configuration Release --no-build \
            --filter-trait "Category=Contract"

  notify-failure:
    needs: contract
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or reuse compatibility issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'GitHub CLI contract tests failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            if (issues.some(issue => !issue.pull_request && issue.title === title)) return;
            await github.rest.issues.create({
              owner, repo, title, assignees: [owner],
              body: [
                'A required SkillView contract test failed against the minimum supported or newest GitHub CLI.',
                '',
                `- [Failed workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
                '- Compare `gh skill` flags, agent selectors, JSON output, and installation behavior.',
                '- Review whether `GhBinaryLocator.MinimumVersion` or `InstallAgentCatalog` needs an update.',
                '- Keep this issue open until both required lanes pass.',
              ].join('\n'),
            });
