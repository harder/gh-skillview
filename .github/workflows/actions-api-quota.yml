name: actions-api-quota

on:
  push:
    branches: [codex/linux-link-abi-probe]
    paths: [.github/workflows/actions-api-quota.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture the Actions token quota without exposing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quota-evidence
          date -u +%Y-%m-%dT%H:%M:%SZ > quota-evidence/observed-at.txt
          gh api --include --method GET -H 'Cache-Control: no-cache' rate_limit > quota-evidence/response.txt
          # These are response-only diagnostics; nonzero statuses remain evidence,
          # and do not waive any product workflow's authentication or proof gate.
          set +e
          gh api --include --method GET repos/cli/cli/git/ref/tags/v2.102.0 \
            > quota-evidence/remote-ref-response.txt 2> quota-evidence/remote-ref.stderr
          printf '%s\n' "$?" > quota-evidence/remote-ref.exit-code
          gh api --include --method GET user \
            > quota-evidence/user-response.txt 2> quota-evidence/user.stderr
          printf '%s\n' "$?" > quota-evidence/user.exit-code
          gh auth status > quota-evidence/auth-status.txt 2>&1
          printf '%s\n' "$?" > quota-evidence/auth-status.exit-code
          set -e
      - name: Retain quota evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-installation-api-quota
          path: quota-evidence/**
          if-no-files-found: error
          retention-days: 14
