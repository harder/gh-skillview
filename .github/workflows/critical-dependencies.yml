name: Critical dependencies

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional existing critical-dependency issue to reassess with Copilot'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: critical-dependencies
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new-issues: ${{ steps.detect.outputs.new-issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Terminal.Gui packages and GitHub CLI releases
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./.github/scripts/critical-dependencies.js')({github, context, core});

  copilot-assessment:
    needs: monitor
    if: needs.monitor.outputs.new-issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.monitor.outputs.new-issues) }}
    permissions:
      contents: read
      issues: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Gather release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.number }}
          PACKAGE_KIND: ${{ matrix.kind }}
          PACKAGE_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .body > dependency-issue.md
          if [ "$PACKAGE_KIND" = gh ]; then
            gh api "repos/cli/cli/releases/tags/${PACKAGE_VERSION}" --jq .body > upstream-release.md
          else
            gh api "repos/tui-cs/Terminal.Gui/releases/tags/v${PACKAGE_VERSION}" --jq .body > upstream-release.md || \
              printf 'No matching GitHub release notes were published for this NuGet version.\n' > upstream-release.md
          fi
      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.92
      - name: Assess compatibility without write tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          copilot -p "$(cat .github/scripts/critical-dependency-prompt.md)" -s \
            --available-tools=view --allow-tool=view --disable-builtin-mcps \
            --no-ask-user --no-auto-update --max-ai-credits=30 \
            > copilot-raw-output.md
          node .github/scripts/critical-dependency-assessment.js \
            copilot-raw-output.md copilot-assessment.md
      - name: Preserve Copilot output for failed assessment diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-assessment-debug-${{ matrix.number }}
          path: copilot-raw-output.md
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-assessment-${{ matrix.number }}
          path: copilot-assessment.md
          retention-days: 7

  publish-assessment:
    needs: [monitor, copilot-assessment]
    if: always() && needs.monitor.result == 'success' && needs.monitor.outputs.new-issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.monitor.outputs.new-issues) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: critical-assessment-${{ matrix.number }}
      - name: Add bounded, attributed issue comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ matrix.number }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { ASSESSMENT_MARKER, isOwnedAssessmentComment, extractAssessment } =
              require('./.github/scripts/critical-dependency-assessment.js');
            const assessment = extractAssessment(fs.readFileSync('copilot-assessment.md', 'utf8'));
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0 ||
                !assessment) {
              throw new Error('Invalid Copilot assessment output');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const body = `${ASSESSMENT_MARKER}\n## Copilot compatibility assessment\n\n` +
                '> Automated analysis of upstream notes and SkillView source. Verify conclusions before changing dependencies or minimum versions.\n\n' +
                assessment;
            const existing = comments.find(isOwnedAssessmentComment);
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
