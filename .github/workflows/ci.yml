name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: 'Run all checks or only Windows native metadata regressions'
        type: choice
        options: [all, windows-metadata]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.verification == 'windows-metadata' && '-windows-metadata' || '' }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_proof: ${{ steps.classify.outputs.full_proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR merge checkout includes both comparison parents. Never fetch
          # event-supplied revisions separately; missing history runs full CI.
          fetch-depth: 2
      - name: Classify changed paths (uncertainty runs full proof)
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-change-scope.js --base "$BASE_SHA" --head "$HEAD_SHA"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Test dependency monitor
        run: node --test .github/scripts/critical-dependencies.test.js .github/scripts/critical-dependency-assessment.test.js
      - name: Test Homebrew formula renderer
        run: python3 -m unittest discover -s .github/scripts -p test_homebrew_formula.py
      - name: Test CI scope and native input contracts
        run: |
          node --test .github/scripts/ci-change-scope.test.js
          python3 -m unittest discover -s .github/scripts -p test_native_proof_inputs.py
          python3 -m unittest discover -s .github/scripts -p test_api_budget.py
      - name: Test native proof fixture contracts
        run: python3 -m unittest discover -s tests/native -p 'test_*.py'

  dependency-review:
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped dependency review' || 'dependency-review' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject newly vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  site-check:
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped site checks' || 'site-check' }}
    if: inputs.verification != 'windows-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and validate local site links
        run: python3 site/build.py
      - name: Check JavaScript syntax
        run: node --check site/app.js

  test:
    needs: scope
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped tests' || 'test' }} (${{ matrix.os }})
    if: always() && inputs.verification != 'windows-metadata' && (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # macOS/Windows must exercise native link retain/restore successfully;
      # Linux proves the explicit unsupported-metadata refusal without mutation.
      SKILLVIEW_EXPOSURE_LINK_PROOF: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Verify code style — dotnet format
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format SkillView.sln --no-restore --verify-no-changes
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
      - name: Prove Linux live native link preservation and hidden attributes on ext4
        if: runner.os == 'Linux'
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          SKILLVIEW_LINUX_EXPOSURE_PRESERVATION_PROOF: '1'
        run: |
          set -euo pipefail
          mkdir -p dist/linux-live-link/input
          cp tests/native/probe-linux-link-preservation-abi.c dist/linux-live-link/input/
          cp tests/native/verify-linux-link-preservation-abi.py dist/linux-live-link/input/
          cp tests/native/prove-linux-link-hidden-attributes.py dist/linux-live-link/input/
          cp tests/SkillView.MaintenanceProof/ExposureLinkProof.cs dist/linux-live-link/input/
          cp tests/SkillView.MaintenanceProof/ExposureLifetimeProof.cs dist/linux-live-link/input/
          cp src/SkillView.Core/Inventory/LinuxExposureOwnerContext.cs dist/linux-live-link/input/
          cp tests/SkillView.Tests/Inventory/LinuxExposureOwnerLifetimeTests.cs dist/linux-live-link/input/
          sha256sum dist/linux-live-link/input/* > dist/linux-live-link/input-sha256.txt
          cc --version > dist/linux-live-link/compiler.txt
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion \
            tests/native/probe-linux-link-preservation-abi.c -o dist/linux-live-link/probe-linux-link-abi
          probe_dir=$(mktemp -d "$RUNNER_TEMP/skillview-link-abi.XXXXXX")
          trap 'rmdir "$probe_dir"' EXIT
          dist/linux-live-link/probe-linux-link-abi "$probe_dir" > dist/linux-live-link/abi.json
          python3 tests/native/verify-linux-link-preservation-abi.py \
            --input dist/linux-live-link/abi.json --source tests/native/probe-linux-link-preservation-abi.c \
            --architecture x64 --output dist/linux-live-link/abi-verified.json
          dotnet build tests/SkillView.MaintenanceProof/SkillView.MaintenanceProof.csproj \
            --configuration Release -p:RestoreLockedMode=true | tee dist/linux-live-link/proof-build.log
          dotnet test --project tests/SkillView.Tests/SkillView.Tests.csproj \
            --configuration Release --no-build \
            --filter-class SkillView.Tests.Inventory.NativeExposureLinkTests \
            --filter-class SkillView.Tests.Inventory.LinuxLinkProcAuthorityTests \
            --filter-class SkillView.Tests.Inventory.LinuxExposureOwnerLifetimeTests \
            | tee dist/linux-live-link/native-tests.log
          python3 tests/native/prove-linux-link-hidden-attributes.py \
            --dotnet "$(command -v dotnet)" \
            --proof tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof.dll \
            --output dist/linux-live-link/hidden-attribute-proof.json
      - name: Retain Linux live link evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: linux-live-link-evidence
          path: dist/linux-live-link/**
          if-no-files-found: error
          retention-days: 14

  windows-metadata:
    needs: scope
    if: always() && (inputs.verification == 'windows-metadata' || needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false')
    name: Windows metadata (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # These native tests must publish and recapture metadata successfully;
      # an environmental refusal is not a passing Windows proof.
      SKILLVIEW_WINDOWS_METADATA_PROOF: '1'
      SKILLVIEW_EXPOSURE_LINK_PROOF: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Prove native security descriptors and alternate streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dotnet test --project tests/SkillView.Tests/SkillView.Tests.csproj \
            --configuration Release -p:RestoreLockedMode=true \
            --filter-class SkillView.Tests.Maintenance.WindowsPayloadMetadataTests \
            --filter-class SkillView.Tests.Maintenance.WindowsBackupReadStreamTests \
            --filter-class SkillView.Tests.Maintenance.WindowsSecurityDescriptorQueryTests \
            --filter-class SkillView.Tests.Maintenance.RecordedTrackingWriterTests \
            --filter-class SkillView.Tests.Maintenance.PinTrackingWriterTests \
            --filter-class SkillView.Tests.Maintenance.StandaloneUnpinTests \
            --filter-class SkillView.Tests.Maintenance.SharedReplacementRevisionTests \
            --filter-class SkillView.Tests.Maintenance.CapturedPayloadArchiveTests \
            --filter-class SkillView.Tests.Maintenance.CapturedResolutionArchiveTests \
            --filter-class SkillView.Tests.Maintenance.ReplacementLocalReviewTests \
            --filter-class SkillView.Tests.Inventory.NativeExposureLinkTests \
            --filter-class SkillView.Tests.Inventory.NativePlacementTests \
            --filter-class SkillView.Tests.Maintenance.LocalSourceSwitchTests \
            --filter-class SkillView.Tests.Maintenance.NativePayloadBorrowedHandleTests \
            | tee dist/windows-metadata-tests.log
      - name: Retain Windows metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: windows-metadata-evidence-${{ matrix.os }}
          path: dist/windows-metadata-tests.log
          if-no-files-found: error
          retention-days: 14

  aot-build:
    needs: scope
    if: always() && inputs.verification != 'windows-metadata' && (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false')
    name: Build native proof inputs (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: osx-arm64
            os: macos-15
            ext: ''
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: win-arm64
            os: windows-11-arm
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: AOT publish (standalone)
        shell: bash
        run: |
          dotnet publish src/SkillView.App/SkillView.App.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:RestoreLockedMode=true \
            -warnaserror:IL2026 -warnaserror:IL3050 -warnaserror:IL3053 \
            -o dist/app
      - name: AOT publish (extension)
        shell: bash
        run: |
          dotnet publish src/SkillView.GhExtension/SkillView.GhExtension.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:RestoreLockedMode=true \
            -o dist/ext
      - name: Bind exact frozen native source, SDK, locks and publish recipe
        id: native-baselines
        run: python .github/scripts/native_proof_inputs.py plan --rid '${{ matrix.rid }}'
      - name: Cache verified frozen producer binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-native/baselines
          key: ${{ steps.native-baselines.outputs.cache-key }}
      - name: Build missing frozen producers and verify every source receipt and binary
        run: python .github/scripts/native_proof_inputs.py prepare --rid '${{ matrix.rid }}'
      - name: Prepare checksum-verified minimum and recorded current gh proof hosts
        shell: bash
        run: |
          set -euo pipefail
          python tests/native/prepare-gh-proof-tool.py --version 2.97.0 --rid '${{ matrix.rid }}' --output ".ci-native/gh-minimum"
          python tests/native/prepare-gh-proof-tool.py --version 2.102.0 --rid '${{ matrix.rid }}' --output ".ci-native/gh-current"
      - name: Smoke-test native binaries
        shell: bash
        run: |
          set -euo pipefail
          test -s 'dist/app/skillview${{ matrix.ext }}'
          test -s 'dist/ext/gh-skillview${{ matrix.ext }}'
          'dist/app/skillview${{ matrix.ext }}' --version
          'dist/ext/gh-skillview${{ matrix.ext }}' --version
      - name: Build disposable maintenance process-death proof host
        shell: bash
        run: dotnet build tests/SkillView.MaintenanceProof/SkillView.MaintenanceProof.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Package this commit's native proof inputs (preserve executable modes)
        run: python .github/scripts/native_proof_inputs.py pack --rid '${{ matrix.rid }}'
      - name: Retain native proof inputs for independent shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-proof-inputs-${{ matrix.rid }}
          path: .ci-native/native-proof-inputs.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Retain frozen source and recipe receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-build-receipts-${{ matrix.rid }}
          path: |
            .ci-native/baseline-plan.json
            .ci-native/baselines/*/source-receipt.json
            .ci-native/native-inputs-manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  aot-proof:
    needs: [scope, aot-build]
    if: always() && inputs.verification != 'windows-metadata' && (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false') && needs.aot-build.result == 'success'
    name: Native proof (${{ matrix.rid }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Keep the original four-runner/API ceiling; schedule expensive Windows families first.
      max-parallel: 4
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
            shard: owners
          - rid: win-arm64
            os: windows-11-arm
            ext: .exe
            shard: owners
          - rid: win-x64
            os: windows-latest
            ext: .exe
            shard: sources
          - rid: win-arm64
            os: windows-11-arm
            ext: .exe
            shard: sources
          - rid: win-x64
            os: windows-latest
            ext: .exe
            shard: inspection-unpin
          - rid: win-arm64
            os: windows-11-arm
            ext: .exe
            shard: inspection-unpin
          - rid: osx-arm64
            os: macos-15
            ext: ''
            shard: owners
          - rid: osx-arm64
            os: macos-15
            ext: ''
            shard: sources
          - rid: osx-arm64
            os: macos-15
            ext: ''
            shard: inspection-unpin
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
            shard: sources
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
            shard: inspection-unpin
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
            shard: owners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Observe API budget at native job start
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage job-start --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Download this run's native proof inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-proof-inputs-${{ matrix.rid }}
          path: .ci-native
      - name: Verify transferred inputs and stage exact historical source checkouts
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/native_proof_inputs.py unpack --rid '${{ matrix.rid }}'
          python .github/scripts/native_proof_inputs.py stage --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}'
      - name: Prove explicit static package checks preserve payloads without running scripts
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-static-package-check.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/package-check-app-proof.json
          python tests/native/prove-static-package-check.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/package-check-extension-proof.json
      - name: Prove explicit retained retirement and process-death protection
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-retained-retirement.py --app 'dist/app/skillview${{ matrix.ext }}' --proof 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --output dist/retirement-app-proof.json
          python tests/native/prove-retained-retirement.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --output dist/retirement-extension-proof.json
      - name: Observe API budget before 01
        if: matrix.shard == 'owners'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-01 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Verify repository API access and retain response evidence
        id: api_primary_01
        if: matrix.shard == 'owners'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/gh-api-access.txt
          test -n "$GH_TOKEN"
          gh api --include --method GET repos/cli/cli/git/ref/tags/v2.102.0 > dist/gh-api-access.txt
          python - <<'PYREF'
          import json, pathlib, re
          headers, body = pathlib.Path('dist/gh-api-access.txt').read_text().split('\n\n', 1)
          result = json.loads(body)
          assert re.fullmatch(r'HTTP/\S+ 200(?: .*)?', headers.splitlines()[0])
          assert result['ref'] == 'refs/tags/v2.102.0'
          assert re.fullmatch(r'[0-9a-f]{40}', result['object']['sha'])
          PYREF
      - name: Observe API budget after 01
        if: always() && (matrix.shard == 'owners') && steps.api_primary_01.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-01 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_01.outcome }}'
      - name: Observe API budget before 02
        if: matrix.shard == 'inspection-unpin'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-02 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove external cleanup suppression without payload mutations
        id: api_primary_02
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/native/prove-cleanup-suppression.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/suppression-app-proof.json
          python tests/native/prove-cleanup-suppression.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/suppression-extension-proof.json
      - name: Observe API budget after 02
        if: always() && (matrix.shard == 'inspection-unpin') && steps.api_primary_02.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-02 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_02.outcome }}'
      - name: Prove native backup evidence and unchanged installed copies
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-maintenance-backup.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/backup-app-proof.json
          python tests/native/prove-maintenance-backup.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/backup-extension-proof.json
      - name: Inspect metadata with openat2 denied; retain removal refusal
        if: matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')
        run: python3 tests/native/prove-metadata-without-openat2.py --app dist/app/skillview
      - name: Refuse linked-worktree and broken Git metadata removals
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-gitfile-protection.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/gitfile-app-proof.json
          python tests/native/prove-gitfile-protection.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/gitfile-extension-proof.json
      - name: Inspect native object evidence without changing installed skills
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-native-object-evidence.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/object-app-proof.json
          python tests/native/prove-native-object-evidence.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/object-extension-proof.json
      - name: Prove shared inventory scope and agent filters without network access
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-inventory-filter.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/inventory-filter-app-proof.json
          python tests/native/prove-inventory-filter.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/inventory-filter-extension-proof.json
      - name: Prove denied scan roots stay diagnostic and cannot authorize cleanup
        if: matrix.shard == 'inspection-unpin' && (runner.os != 'Windows')
        shell: bash
        run: |
          python tests/native/prove-inventory-denied-root.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/inventory-denied-app-proof.json
          python tests/native/prove-inventory-denied-root.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/inventory-denied-extension-proof.json
      - name: Prove managed and built-in discovery preserves read-only resources
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
          python tests/native/prove-managed-discovery.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/managed-discovery-app-proof.json
          python tests/native/prove-managed-discovery.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/managed-discovery-extension-proof.json
      - name: Prove physical installation identities and frozen operation subjects
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        run: |
