          prove_legacy --legacy-schema 6 --old-app "$SKILLVIEW_SOURCE_SWITCH_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_SOURCE_SWITCH_CHECKOUT" --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_current" --kill-boundary install-moved --output dist/old-native-source-switch-extension-proof.json
      - name: Prove privileged Linux source switching on the private container root
        if: matrix.shard == 'sources' && (matrix.rid == 'linux-x64')
        shell: bash
        run: |
          set -euo pipefail
          for host in app/skillview ext/gh-skillview; do
            proof_name="${host%%/*}"
            proof_boundary=retain-moved
            if [ "$proof_name" = ext ]; then proof_boundary=install-moved; fi
            python3 tests/native/run-local-source-switch-docker.py \
              --app "dist/$host" --proof-host-dir tests/SkillView.MaintenanceProof/bin/Release/net10.0 \
              --gh ".ci-native/gh-current/gh" --extra-gh ".ci-native/gh-minimum/gh" \
              --legacy-app "$SKILLVIEW_REIMPORT_CHECKOUT/dist/app/skillview" --legacy-checkout "$SKILLVIEW_REIMPORT_CHECKOUT" --legacy-kill-boundary "$proof_boundary" \
              --source-switch-legacy-app "$SKILLVIEW_SOURCE_SWITCH_CHECKOUT/dist/app/skillview" --source-switch-legacy-checkout "$SKILLVIEW_SOURCE_SWITCH_CHECKOUT" \
              --output "dist/local-source-switch-privileged-$proof_name-proof" --platform linux/amd64
          done
      - name: Capture source-switch proof inputs
        if: matrix.shard == 'sources' && (always())
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source-switch-proof-inputs
          cp tests/native/prove-local-source-switch.py tests/native/prove-old-native-reimport.py \
            tests/native/prove-local-reimport.py tests/native/source_review_proof.py tests/native/run-local-source-switch-docker.py \
            tests/SkillView.MaintenanceProof/Program.cs dist/source-switch-proof-inputs/
      - name: Observe API budget before 14
        if: matrix.shard == 'sources'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-14 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove actual previous native saved plans survive the new schema boundary
        id: api_primary_14
        if: matrix.shard == 'sources'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_current=".ci-native/gh-current/gh${{ matrix.ext }}"
          prove_legacy() {
            if [ "$RUNNER_OS" = Linux ]; then
              python tests/native/prove-old-native-plans.py --expect-schema3-metadata-refusal CAP_SYS_ADMIN "$@"
            else
              python tests/native/prove-old-native-plans.py "$@"
            fi
          }
          prove_legacy --old-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --app 'dist/app/skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_current" --kill-boundary retain-moved --output dist/old-native-app-proof.json
          prove_legacy --old-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_current" --kill-boundary install-moved --output dist/old-native-extension-proof.json
      - name: Observe API budget after 14
        if: always() && (matrix.shard == 'sources') && steps.api_primary_14.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-14 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_14.outcome }}'
      - name: Observe API budget before 15
        if: matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-15 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove privileged Linux unpin and native schema compatibility on private tmpfs
        id: api_primary_15
        if: matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for host in app/skillview ext/gh-skillview; do
            proof_name="${host%%/*}"
            proof_boundary=retain-moved
            if [ "$proof_name" = ext ]; then proof_boundary=install-moved; fi
            python3 tests/native/run-local-merge-disk-full-docker.py --unpin-only \
              --app "dist/$host" --proof-host-dir tests/SkillView.MaintenanceProof/bin/Release/net10.0 \
              --gh ".ci-native/gh-current/gh" --extra-gh ".ci-native/gh-minimum/gh" \
              --legacy-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview" --legacy-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --legacy-kill-boundary "$proof_boundary" \
              --output "dist/unpin-privileged-$proof_name-proof" --platform linux/amd64
          done
      - name: Observe API budget after 15
        if: always() && (matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')) && steps.api_primary_15.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-15 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_15.outcome }}'
      - name: Observe API budget before 16
        if: matrix.shard == 'inspection-unpin'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-16 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove historical local dispositions and frozen resolutions
        id: api_primary_16
        if: matrix.shard == 'inspection-unpin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          prove_local_merge() {
            if [ "$RUNNER_OS" = Linux ]; then
              python tests/native/prove-local-merge-update.py --old-app "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT" --gh "$proof_gh_path" --resolved --expect-metadata-refusal CAP_SYS_ADMIN "$@"
            else
              python tests/native/prove-local-merge-update.py --old-app "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT" --gh "$proof_gh_path" --resolved "$@"
            fi
          }
          prove_local_merge --app 'dist/app/skillview${{ matrix.ext }}' --output dist/local-merge-app-proof.json
          prove_local_merge --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/local-merge-extension-proof.json
      - name: Observe API budget after 16
        if: always() && (matrix.shard == 'inspection-unpin') && steps.api_primary_16.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-16 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_16.outcome }}'
      - name: Observe API budget before 17
        if: matrix.shard == 'inspection-unpin' && (runner.os != 'Linux')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-17 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove merged payload restart recovery at every directory move
        id: api_primary_17
        if: matrix.shard == 'inspection-unpin' && (runner.os != 'Linux')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          for boundary in retain-moved install-moved displace-moved restore-moved; do
            python tests/native/prove-local-merge-update.py --old-app "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT" --app 'dist/app/skillview${{ matrix.ext }}' --gh "$proof_gh_path" --resolved \
              --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' \
              --kill-boundary "$boundary" --output "dist/local-merge-killed-${boundary}-proof.json"
          done
      - name: Observe API budget after 17
        if: always() && (matrix.shard == 'inspection-unpin' && (runner.os != 'Linux')) && steps.api_primary_17.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-17 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_17.outcome }}'
      - name: Observe API budget before 18
        if: matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage before-18 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result 'before'
      - name: Prove real disk-full recovery on isolated bounded tmpfs
        id: api_primary_18
        if: matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          python3 tests/native/run-local-merge-disk-full-docker.py \
            --app dist/app/skillview \
            --proof-host-dir tests/SkillView.MaintenanceProof/bin/Release/net10.0 \
            --legacy-app "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT/dist/app/skillview" --legacy-checkout "$SKILLVIEW_REVIEWED_MERGE_CHECKOUT" \
            --gh "$proof_gh_path" --output dist/disk-full-proof --platform linux/amd64
      - name: Observe API budget after 18
        if: always() && (matrix.shard == 'inspection-unpin' && (runner.os == 'Linux')) && steps.api_primary_18.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/api_budget.py --stage after-18 --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}' --result '${{ steps.api_primary_18.outcome }}'
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-maintenance-evidence-${{ matrix.rid }}-${{ matrix.shard }}
          path: |
            dist/*-proof.json
            dist/gh-api-access.txt
            dist/api-budget/api-budget-*.json
            dist/disk-full-proof/**
            dist/unpin-privileged-*-proof/**
            dist/local-reimport-privileged-*-proof/**
            dist/local-source-switch-privileged-*-proof/**
            dist/old-native-reimport-*-proof-raw/**
            dist/old-native-source-switch-*-proof-raw/**
            dist/source-switch-proof-inputs/**
            dist/registry-restore-*-proof-raw/**
            dist/registry-retirement-*-proof-raw/**
            dist/registry-restore-privileged-*-proof-launch/launch.json
            dist/registry-restore-privileged-*-proof-launch/stdout.bin
            dist/registry-restore-privileged-*-proof-launch/stderr.bin
            dist/registry-retirement-privileged-*-proof-launch/launch.json
            dist/registry-retirement-privileged-*-proof-launch/stdout.bin
            dist/registry-retirement-privileged-*-proof-launch/stderr.bin
          if-no-files-found: warn
          retention-days: 14
      - name: Record completed proof family for aggregate gating
        run: python .github/scripts/native_proof_inputs.py completion --rid '${{ matrix.rid }}' --shard '${{ matrix.shard }}'
      - name: Retain this run's proof completion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-proof-completion-${{ matrix.rid }}-${{ matrix.shard }}
          path: dist/proof-completion/*.json
          if-no-files-found: error
          retention-days: 14

  aot-smoke:
    # Preserve existing per-RID check names, including failed/canceled/missing dependencies.
    needs: [scope, aot-build, aot-proof]
    if: always() && inputs.verification != 'windows-metadata'
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped ' || '' }}AOT publish smoke (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, osx-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Gather native verification evidence (including partial failures)
        if: (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false') && needs.aot-proof.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-maintenance-evidence-${{ matrix.rid }}-*
          path: dist/native-evidence
          merge-multiple: true
      - name: Retain combined native verification evidence under its existing name
        if: always() && (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false') && needs.aot-proof.result != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: native-maintenance-evidence-${{ matrix.rid }}
          path: dist/native-evidence/**
          if-no-files-found: warn
          retention-days: 14
      - name: Gather completed proof families
        if: (needs.scope.result != 'success' || needs.scope.outputs.full_proof != 'false') && needs.aot-build.result == 'success' && needs.aot-proof.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-proof-completion-${{ matrix.rid }}-*
          path: dist/proof-completion
          merge-multiple: true
      - name: Require every native build and proof family
        if: always()
        env:
          FULL_PROOF: ${{ needs.scope.outputs.full_proof }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_RESULT: ${{ needs.aot-build.result }}
          PROOF_RESULT: ${{ needs.aot-proof.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL_PROOF" == false && "$SCOPE_RESULT" == success ]]; then
            echo 'Only positively classified user documentation/site/media changed; native proof is unnecessary.'
            exit 0
          fi
          test "$BUILD_RESULT" = success
          test "$PROOF_RESULT" = success
          python3 .github/scripts/native_proof_inputs.py verify-completions --rid '${{ matrix.rid }}'
