name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification:
        description: 'Run all checks or only Windows native metadata regressions'
        type: choice
        options: [all, windows-metadata]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.verification == 'windows-metadata' && '-windows-metadata' || '' }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Test dependency monitor
        run: node --test .github/scripts/critical-dependencies.test.js .github/scripts/critical-dependency-assessment.test.js
      - name: Test Homebrew formula renderer
        run: python3 -m unittest discover -s .github/scripts -p test_homebrew_formula.py

  dependency-review:
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped dependency review' || 'dependency-review' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject newly vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  site-check:
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped site checks' || 'site-check' }}
    if: inputs.verification != 'windows-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and validate local site links
        run: python3 site/build.py
      - name: Check JavaScript syntax
        run: node --check site/app.js

  test:
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped tests' || 'test' }} (${{ matrix.os }})
    if: inputs.verification != 'windows-metadata'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Verify code style — dotnet format
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format SkillView.sln --no-restore --verify-no-changes
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  windows-metadata:
    name: Windows metadata (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # These native tests must publish and recapture metadata successfully;
      # an environmental refusal is not a passing Windows proof.
      SKILLVIEW_WINDOWS_METADATA_PROOF: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Prove native security descriptors and alternate streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dotnet test --project tests/SkillView.Tests/SkillView.Tests.csproj \
            --configuration Release -p:RestoreLockedMode=true \
            --filter-class SkillView.Tests.Maintenance.WindowsPayloadMetadataTests \
            --filter-class SkillView.Tests.Maintenance.WindowsBackupReadStreamTests \
            --filter-class SkillView.Tests.Maintenance.WindowsSecurityDescriptorQueryTests \
            --filter-class SkillView.Tests.Maintenance.RecordedTrackingWriterTests \
            --filter-class SkillView.Tests.Maintenance.PinTrackingWriterTests \
            --filter-class SkillView.Tests.Maintenance.StandaloneUnpinTests \
            --filter-class SkillView.Tests.Maintenance.SharedReplacementRevisionTests \
            --filter-class SkillView.Tests.Maintenance.CapturedPayloadArchiveTests \
            --filter-class SkillView.Tests.Maintenance.CapturedResolutionArchiveTests \
            --filter-class SkillView.Tests.Maintenance.ReplacementLocalReviewTests \
            --filter-class SkillView.Tests.Maintenance.NativePayloadBorrowedHandleTests \
            | tee dist/windows-metadata-tests.log
      - name: Retain Windows metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-metadata-evidence-${{ matrix.os }}
          path: dist/windows-metadata-tests.log
          if-no-files-found: error
          retention-days: 14

  aot-smoke:
    if: inputs.verification != 'windows-metadata'
    name: ${{ inputs.verification == 'windows-metadata' && 'Diagnostics only - skipped ' || '' }}AOT publish smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: osx-arm64
            os: macos-15
            ext: ''
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: win-arm64
            os: windows-11-arm
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: AOT publish (standalone)
        shell: bash
        run: |
          dotnet publish src/SkillView.App/SkillView.App.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:RestoreLockedMode=true \
            -warnaserror:IL2026 -warnaserror:IL3050 -warnaserror:IL3053 \
            -o dist/app
      - name: AOT publish (extension)
        shell: bash
        run: |
          dotnet publish src/SkillView.GhExtension/SkillView.GhExtension.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:RestoreLockedMode=true \
            -o dist/ext
      - name: Build exact previous native host for saved-plan compatibility
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha=0dba59be59776e6e654123aa1ce1e5496074763e
          baseline_path="$RUNNER_TEMP/skillview-unpin-baseline"
          git fetch --no-tags origin "$baseline_sha"
          git worktree add --detach "$baseline_path" "$baseline_sha"
          dotnet publish "$baseline_path/src/SkillView.App/SkillView.App.csproj" \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:RestoreLockedMode=true \
            -warnaserror:IL2026 -warnaserror:IL3050 -warnaserror:IL3053 \
            -o "$baseline_path/dist/app"
          printf 'SKILLVIEW_LEGACY_CHECKOUT=%s\n' "$baseline_path" >> "$GITHUB_ENV"
      - name: Prepare checksum-verified minimum and recorded current gh proof hosts
        shell: bash
        run: |
          set -euo pipefail
          python agent_docs/evidence/prepare-gh-proof-tool.py --version 2.97.0 --rid '${{ matrix.rid }}' --output "$RUNNER_TEMP/skillview-proof-gh-minimum"
          python agent_docs/evidence/prepare-gh-proof-tool.py --version 2.102.0 --rid '${{ matrix.rid }}' --output "$RUNNER_TEMP/skillview-proof-gh-current"
      - name: Smoke-test native binaries
        shell: bash
        run: |
          set -euo pipefail
          test -s 'dist/app/skillview${{ matrix.ext }}'
          test -s 'dist/ext/gh-skillview${{ matrix.ext }}'
          'dist/app/skillview${{ matrix.ext }}' --version
          'dist/ext/gh-skillview${{ matrix.ext }}' --version
      - name: Prove explicit static package checks preserve payloads without running scripts
        shell: bash
        run: |
          python agent_docs/evidence/prove-static-package-check.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/package-check-app-proof.json
          python agent_docs/evidence/prove-static-package-check.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/package-check-extension-proof.json
      - name: Verify repository API access and retain response evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/gh-api-access.txt
          test -n "$GH_TOKEN"
          gh api --include --method GET repos/cli/cli/git/ref/tags/v2.102.0 > dist/gh-api-access.txt
          python - <<'PYREF'
          import json, pathlib, re
          headers, body = pathlib.Path('dist/gh-api-access.txt').read_text().split('\n\n', 1)
          result = json.loads(body)
          assert re.fullmatch(r'HTTP/\S+ 200(?: .*)?', headers.splitlines()[0])
          assert result['ref'] == 'refs/tags/v2.102.0'
          assert re.fullmatch(r'[0-9a-f]{40}', result['object']['sha'])
          PYREF
      - name: Prove contextual agent loading without starting AI clients
        shell: bash
        run: |
          proof_gh_path="$(python -c 'import shutil; print(shutil.which("gh") or "", end="")')"
          python agent_docs/evidence/prove-effective-loading.py --app 'dist/app/skillview${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/effective-loading-app-proof.json
          python agent_docs/evidence/prove-effective-loading.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/effective-loading-extension-proof.json
      - name: Prove external cleanup suppression without payload mutations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent_docs/evidence/prove-cleanup-suppression.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/suppression-app-proof.json
          python agent_docs/evidence/prove-cleanup-suppression.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/suppression-extension-proof.json
      - name: Prove native backup evidence and unchanged installed copies
        shell: bash
        run: |
          python agent_docs/evidence/prove-maintenance-backup.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/backup-app-proof.json
          python agent_docs/evidence/prove-maintenance-backup.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/backup-extension-proof.json
      - name: Inspect metadata with openat2 denied; retain removal refusal
        if: runner.os == 'Linux'
        run: python3 agent_docs/evidence/prove-metadata-without-openat2.py --app dist/app/skillview
      - name: Refuse linked-worktree and broken Git metadata removals
        shell: bash
        run: |
          python agent_docs/evidence/prove-gitfile-protection.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/gitfile-app-proof.json
          python agent_docs/evidence/prove-gitfile-protection.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/gitfile-extension-proof.json
      - name: Inspect native object evidence without changing installed skills
        shell: bash
        run: |
          python agent_docs/evidence/prove-native-object-evidence.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/object-app-proof.json
          python agent_docs/evidence/prove-native-object-evidence.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/object-extension-proof.json
      - name: Prove shared inventory scope and agent filters without network access
        shell: bash
        run: |
          python agent_docs/evidence/prove-inventory-filter.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/inventory-filter-app-proof.json
          python agent_docs/evidence/prove-inventory-filter.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/inventory-filter-extension-proof.json
      - name: Prove denied scan roots stay diagnostic and cannot authorize cleanup
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python agent_docs/evidence/prove-inventory-denied-root.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/inventory-denied-app-proof.json
          python agent_docs/evidence/prove-inventory-denied-root.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/inventory-denied-extension-proof.json
      - name: Prove managed and built-in discovery preserves read-only resources
        shell: bash
        run: |
          python agent_docs/evidence/prove-managed-discovery.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/managed-discovery-app-proof.json
          python agent_docs/evidence/prove-managed-discovery.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/managed-discovery-extension-proof.json
      - name: Prove physical installation identities and frozen operation subjects
        shell: bash
        run: |
          python agent_docs/evidence/prove-installation-identities.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/identities-app-proof.json
          python agent_docs/evidence/prove-installation-identities.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/identities-extension-proof.json
      - name: Prove standalone quarantine and undo using native hosts
        shell: bash
        run: |
          python agent_docs/evidence/prove-quarantine-undo.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/quarantine-app-proof.json
          python agent_docs/evidence/prove-quarantine-undo.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/quarantine-extension-proof.json
      - name: Prove actual gh tracking metadata round trips through native hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent_docs/evidence/prove-tracking-roundtrip.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/tracking-app-proof.json
          python agent_docs/evidence/prove-tracking-roundtrip.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/tracking-extension-proof.json
      - name: Prove update outcomes, same-tree repairs and no-op object preservation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent_docs/evidence/prove-update-outcomes.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/update-outcomes-app-proof.json
          python agent_docs/evidence/prove-update-outcomes.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/update-outcomes-extension-proof.json
      - name: Prove recorded restoration and undo with real gh and native hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent_docs/evidence/prove-recorded-replacement.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/replacement-app-proof.json
          python agent_docs/evidence/prove-recorded-replacement.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/replacement-extension-proof.json
      - name: Build disposable maintenance process-death proof host
        shell: bash
        run: dotnet build tests/SkillView.MaintenanceProof/SkillView.MaintenanceProof.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Prove immutable revision updates with native hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python agent_docs/evidence/prove-revision-update.py --app 'dist/app/skillview${{ matrix.ext }}' --output dist/revision-app-proof.json
          python agent_docs/evidence/prove-revision-update.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/revision-extension-proof.json
      - name: Prove shared owner updates and torn-registry repair after process death
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proof_gh_path="$(command -v gh)"
          python agent_docs/evidence/prove-shared-revision-update.py --app 'dist/app/skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/shared-owner-app-proof.json
          python agent_docs/evidence/prove-shared-revision-update.py --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/shared-owner-extension-proof.json
      - name: Prove reviewed shared-owner merges and restart repair
        if: runner.os != 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          python agent_docs/evidence/prove-shared-revision-update.py --merged --app 'dist/app/skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/shared-local-merge-app-proof.json
          python agent_docs/evidence/prove-shared-revision-update.py --merged --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_path" --output dist/shared-local-merge-extension-proof.json
      - name: Prove standalone unpin without source access on both native hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_current="$RUNNER_TEMP/skillview-proof-gh-current/gh${{ matrix.ext }}"
          proof_gh_minimum="$RUNNER_TEMP/skillview-proof-gh-minimum/gh${{ matrix.ext }}"
          prove_unpin() {
            if [ "$RUNNER_OS" = Linux ]; then
              python agent_docs/evidence/prove-shared-revision-update.py --unpin-only --expect-metadata-refusal CAP_SYS_ADMIN "$@"
            else
              python agent_docs/evidence/prove-shared-revision-update.py --unpin-only "$@"
            fi
          }
          prove_unpin --app 'dist/app/skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_minimum" --gh "$proof_gh_current" --output dist/unpin-app-proof.json
          prove_unpin --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_minimum" --gh "$proof_gh_current" --output dist/unpin-extension-proof.json
      - name: Prove actual previous native saved plans survive the new schema boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_current="$RUNNER_TEMP/skillview-proof-gh-current/gh${{ matrix.ext }}"
          prove_legacy() {
            if [ "$RUNNER_OS" = Linux ]; then
              python agent_docs/evidence/prove-old-native-plans.py --expect-schema3-metadata-refusal CAP_SYS_ADMIN "$@"
            else
              python agent_docs/evidence/prove-old-native-plans.py "$@"
            fi
          }
          prove_legacy --old-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --app 'dist/app/skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_current" --kill-boundary retain-moved --output dist/old-native-app-proof.json
          prove_legacy --old-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview${{ matrix.ext }}" --old-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --app 'dist/ext/gh-skillview${{ matrix.ext }}' --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' --gh "$proof_gh_current" --kill-boundary install-moved --output dist/old-native-extension-proof.json
      - name: Prove privileged Linux unpin and native schema compatibility on private tmpfs
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for host in app/skillview ext/gh-skillview; do
            proof_name="${host%%/*}"
            proof_boundary=retain-moved
            if [ "$proof_name" = ext ]; then proof_boundary=install-moved; fi
            python3 agent_docs/evidence/run-local-merge-disk-full-docker.py --unpin-only \
              --app "dist/$host" --proof-host-dir tests/SkillView.MaintenanceProof/bin/Release/net10.0 \
              --gh "$RUNNER_TEMP/skillview-proof-gh-current/gh" --extra-gh "$RUNNER_TEMP/skillview-proof-gh-minimum/gh" \
              --legacy-app "$SKILLVIEW_LEGACY_CHECKOUT/dist/app/skillview" --legacy-checkout "$SKILLVIEW_LEGACY_CHECKOUT" --legacy-kill-boundary "$proof_boundary" \
              --output "dist/unpin-privileged-$proof_name-proof" --platform linux/amd64
          done
      - name: Prove reviewed local dispositions and frozen resolutions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          prove_local_merge() {
            if [ "$RUNNER_OS" = Linux ]; then
              python agent_docs/evidence/prove-local-merge-update.py --gh "$proof_gh_path" --resolved --expect-metadata-refusal CAP_SYS_ADMIN "$@"
            else
              python agent_docs/evidence/prove-local-merge-update.py --gh "$proof_gh_path" --resolved "$@"
            fi
          }
          prove_local_merge --app 'dist/app/skillview${{ matrix.ext }}' --output dist/local-merge-app-proof.json
          prove_local_merge --app 'dist/ext/gh-skillview${{ matrix.ext }}' --output dist/local-merge-extension-proof.json
      - name: Prove merged payload restart recovery at every directory move
        if: runner.os != 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          for boundary in retain-moved install-moved displace-moved restore-moved; do
            python agent_docs/evidence/prove-local-merge-update.py --app 'dist/app/skillview${{ matrix.ext }}' --gh "$proof_gh_path" --resolved \
              --proof-host 'tests/SkillView.MaintenanceProof/bin/Release/net10.0/SkillView.MaintenanceProof${{ matrix.ext }}' \
              --kill-boundary "$boundary" --output "dist/local-merge-killed-${boundary}-proof.json"
          done
      - name: Prove real disk-full recovery on isolated bounded tmpfs
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_gh_path="$(command -v gh)"
          python3 agent_docs/evidence/run-local-merge-disk-full-docker.py \
            --app dist/app/skillview \
            --proof-host-dir tests/SkillView.MaintenanceProof/bin/Release/net10.0 \
            --gh "$proof_gh_path" --output dist/disk-full-proof --platform linux/amd64
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-maintenance-evidence-${{ matrix.rid }}
          path: |
            dist/*-proof.json
            dist/gh-api-access.txt
            dist/disk-full-proof/**
            dist/unpin-privileged-*-proof/**
          if-no-files-found: warn
          retention-days: 14
